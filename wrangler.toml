name = "review-outpost"
main = "src/index.ts"
compatibility_date = "2025-03-01"
workers_dev = false
preview_urls = false
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

# Custom domain route (workers_dev = false disables *.workers.dev; bind your custom domain
# in Cloudflare Dashboard -> Worker -> Settings -> Domains & Routes, or uncomment below locally):
# routes = [
#   { pattern = "review.<YOUR_DOMAIN>", custom_domain = true }
# ]

[triggers]
crons = ["0 4 * * *"]

[[r2_buckets]]
binding = "PREVIEWS_BUCKET"
bucket_name = "review-outpost-previews"

[[d1_databases]]
binding = "DB"
database_name = "review-outpost-db"
database_id = "<D1_DATABASE_ID>"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
DEV_BYPASS_ACCESS = "false"
